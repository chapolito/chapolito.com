    <script>
      (function () {
        var grid = document.getElementById("grid");
        var projects = (window.PROJECTS || []).filter(function (p) {
          return (
            p.id !== "mk-play" &&
            p.id !== "life360-messaging" &&
            p.id !== "horizon-chat"
          );
        });

        function tileVideoSrc(src) {
          if (!src || !/\.mp4$/i.test(src)) return src;
          if (/\.tile\.mp4$/i.test(src)) return src;
          return src.replace(/\.mp4$/i, ".tile.mp4");
        }

        function appendIntroTile() {
          var tile = document.createElement("article");
          tile.className = "tile tile--statement";
          tile.dataset.id = "intro";
          tile.dataset.static = "true";
          tile.setAttribute("aria-label", "About Jesse O'Chapo");

          var surface = document.createElement("div");
          surface.className = "tile__surface";
          tile.appendChild(surface);

          var statement = document.createElement("div");
          statement.className = "tile__statement";

          var logo = document.createElement("img");
          logo.className = "tile__statement-logo";
          logo.src = "/images/home/intro-chapolito-logo.svg";
          logo.alt = "";
          logo.width = 95;
          logo.height = 30;
          statement.appendChild(logo);

          var body = document.createElement("div");
          body.className = "tile__statement-body";

          var copy = document.createElement("p");
          copy.className = "tile__statement-copy";
          copy.textContent =
            "Hi, I'm Jesse. A designer who builds, ships, & steers. I'm at ease with the unknown.";
          body.appendChild(copy);

          var meta = document.createElement("div");
          meta.className = "tile__statement-meta";
          var ex = document.createElement("span");
          ex.className = "tile__statement-ex";
          ex.textContent = "x Meta, Life360, & MTV";
          meta.appendChild(ex);

          var sepLoc = document.createElement("span");
          sepLoc.className = "tile__statement-sep";
          sepLoc.setAttribute("aria-hidden", "true");
          sepLoc.textContent = "·";
          meta.appendChild(sepLoc);

          var loc = document.createElement("span");
          loc.className = "tile__statement-loc";
          loc.textContent = "Santa Cruz, CA";
          meta.appendChild(loc);

          var sepSocial = document.createElement("span");
          sepSocial.className = "tile__statement-sep";
          sepSocial.setAttribute("aria-hidden", "true");
          sepSocial.textContent = "·";
          meta.appendChild(sepSocial);

          var social = document.createElement("span");
          social.className = "tile__statement-social";
          social.innerHTML =
            '<a class="tile__statement-social-link" href="mailto:jesse@chapolito.com" aria-label="Email Jesse O\'Chapo">' +
            '<img src="/images/dock/icon-email.svg" alt="" width="14" height="14" /></a>' +
            '<a class="tile__statement-social-link" href="https://www.linkedin.com/in/chapolito" aria-label="LinkedIn profile" rel="noopener noreferrer" target="_blank">' +
            '<img src="/images/dock/icon-linkedin.svg" alt="" width="14" height="14" /></a>' +
            '<a class="tile__statement-social-link" href="https://github.com/chapolito" aria-label="GitHub profile" rel="noopener noreferrer" target="_blank">' +
            '<img src="/images/dock/icon-github.svg" alt="" width="14" height="14" /></a>';
          meta.appendChild(social);
          body.appendChild(meta);

          var looking = document.createElement("div");
          looking.className = "tile__looking";
          looking.setAttribute("aria-label", "Currently looking");
          var lookingSlot = document.createElement("div");
          lookingSlot.className = "tile__looking-slot";
          looking.innerHTML =
            '<div class="tile__looking-frame">' +
            '<div class="tile__looking-top">' +
            '<span class="tile__looking-lead">' +
            '<svg class="tile__looking-eye" viewBox="0 0 27 15" width="27" height="15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">' +
            '<path class="tile__looking-eye-sclera" d="M26.0146 7.40741C26.0146 9.091 19.726 14.4444 13.4015 14.4444C7.07688 14.4444 0.788321 9.27618 0.788321 7.40741C0.788321 5.53863 7.07688 0.37037 13.4015 0.37037C19.726 0.37037 26.0146 5.72382 26.0146 7.40741Z" fill="#CCFDE9"/>' +
            '<g clip-path="url(#looking-eye-sclera-clip)">' +
            '<g class="tile__looking-eye-gaze">' +
            '<path class="tile__looking-eye-iris" d="M13.4694 12.6603C16.5546 12.6603 19.0556 10.3102 19.0556 7.41122C19.0556 4.51226 16.5546 2.16219 13.4694 2.16219C10.3842 2.16219 7.88321 4.51226 7.88321 7.41122C7.88321 10.3102 10.3842 12.6603 13.4694 12.6603Z" fill="#47FFB2"/>' +
            '<path class="tile__looking-eye-pupil" d="M13.4022 9.26293C14.4911 9.26293 15.3738 8.43349 15.3738 7.41033C15.3738 6.38717 14.4911 5.55774 13.4022 5.55774C12.3134 5.55774 11.4307 6.38717 11.4307 7.41033C11.4307 8.43349 12.3134 9.26293 13.4022 9.26293Z" fill="#222229"/>' +
            "</g></g>" +
            '<defs><clipPath id="looking-eye-sclera-clip" clipPathUnits="userSpaceOnUse"><path d="M26.0146 7.40741C26.0146 9.091 19.726 14.4444 13.4015 14.4444C7.07688 14.4444 0.788321 9.27618 0.788321 7.40741C0.788321 5.53863 7.07688 0.37037 13.4015 0.37037C19.726 0.37037 26.0146 5.72382 26.0146 7.40741Z"/></clipPath></defs>' +
            "</svg>" +
            '<span class="tile__looking-label">Looking</span>' +
            "</span>" +
            '<a class="tile__looking-resume" href="/Jesse%20O%27Chapo%20-%20Resume.pdf" download="Jesse O\'Chapo - Resume.pdf" tabindex="-1" aria-hidden="true">' +
            '<img src="/images/home/looking-download.svg" alt="" width="12" height="12" />' +
            "Résumé" +
            "</a>" +
            "</div>" +
            '<p class="tile__looking-copy">' +
            '<span class="tile__looking-status" aria-hidden="true">Actively interviewing</span>' +
            '<span class="tile__looking-sep" aria-hidden="true"> · </span>' +
            '<span class="tile__looking-detail" aria-hidden="true">' +
            "Principal or Staff Product Design role in Consumer AI, social, messaging, or fintech. Remote or Bay Area." +
            "</span>" +
            "</p>" +
            "</div>";

          var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
          var fineHover = window.matchMedia("(hover: hover) and (pointer: fine)");
          /* Tap expand: coarse/no-hover, or the mobile layout breakpoint (DevTools
             often still reports pointer:fine while emulating a phone width). */
          var tapExpand = window.matchMedia(
            "(hover: none), (pointer: coarse), (max-width: 600px)"
          );
          var statusEl = looking.querySelector(".tile__looking-status");
          var resumeEl = looking.querySelector(".tile__looking-resume");
          var detailEl = looking.querySelector(".tile__looking-detail");
          var eyeEl = looking.querySelector(".tile__looking-eye");
          var gazeEl = looking.querySelector(".tile__looking-eye-gaze");
          var gazeX = 0;
          var gazeY = 0;
          var gazeTargetX = 0;
          var gazeTargetY = 0;
          var gazeRaf = 0;
          var GAZE_MAX_X = 3.35;
          var GAZE_MAX_Y = 1.85;
          var GAZE_CX = 13.435;
          var GAZE_CY = 7.41;

          function applyLookingGaze() {
            var ax = Math.abs(gazeX / GAZE_MAX_X);
            var ay = Math.abs(gazeY / GAZE_MAX_Y);
            var sx = 1 - ax * 0.14 + ay * 0.05;
            var sy = 1 - ay * 0.12 + ax * 0.06;
            gazeEl.setAttribute(
              "transform",
              "translate(" +
                gazeX.toFixed(3) +
                " " +
                gazeY.toFixed(3) +
                ") translate(" +
                GAZE_CX +
                " " +
                GAZE_CY +
                ") scale(" +
                sx.toFixed(4) +
                " " +
                sy.toFixed(4) +
                ") translate(" +
                -GAZE_CX +
                " " +
                -GAZE_CY +
                ")"
            );
          }

          function tickLookingGaze() {
            gazeX += (gazeTargetX - gazeX) * 0.16;
            gazeY += (gazeTargetY - gazeY) * 0.16;
            applyLookingGaze();
            if (
              Math.abs(gazeTargetX - gazeX) > 0.02 ||
              Math.abs(gazeTargetY - gazeY) > 0.02
            ) {
              gazeRaf = window.requestAnimationFrame(tickLookingGaze);
            } else {
              gazeX = gazeTargetX;
              gazeY = gazeTargetY;
              applyLookingGaze();
              gazeRaf = 0;
            }
          }

          function onLookingGazeMove(e) {
            if (reduceMotion.matches || !fineHover.matches || !gazeEl) return;
            var rect = eyeEl.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;
            var dx = e.clientX - cx;
            var dy = e.clientY - cy;
            var tileRect = tile.getBoundingClientRect();
            var reachX = Math.max(tileRect.width * 0.55, rect.width * 4);
            var reachY = Math.max(tileRect.height * 0.55, rect.height * 4);
            gazeTargetX = Math.max(-GAZE_MAX_X, Math.min(GAZE_MAX_X, (dx / reachX) * GAZE_MAX_X));
            gazeTargetY = Math.max(-GAZE_MAX_Y, Math.min(GAZE_MAX_Y, (dy / reachY) * GAZE_MAX_Y));
            if (!gazeRaf) gazeRaf = window.requestAnimationFrame(tickLookingGaze);
          }

          function resetLookingGaze() {
            gazeTargetX = 0;
            gazeTargetY = 0;
            if (!gazeRaf) gazeRaf = window.requestAnimationFrame(tickLookingGaze);
          }

          if (gazeEl && fineHover.matches) {
            tile.addEventListener("pointermove", onLookingGazeMove, { passive: true });
            tile.addEventListener("pointerleave", resetLookingGaze);
          }

          function setLookingAria(expanded) {
            looking.setAttribute("aria-expanded", expanded ? "true" : "false");
            statusEl.setAttribute("aria-hidden", expanded ? "false" : "true");
            detailEl.setAttribute("aria-hidden", expanded ? "false" : "true");
            if (expanded) {
              resumeEl.removeAttribute("aria-hidden");
              resumeEl.removeAttribute("tabindex");
            } else {
              resumeEl.setAttribute("aria-hidden", "true");
              resumeEl.setAttribute("tabindex", "-1");
            }
          }

          looking.setAttribute("role", "button");
          looking.setAttribute("tabindex", "0");
          looking.setAttribute("aria-expanded", "false");

          var lookingCollapseTimer = 0;
          var LOOKING_COLLAPSE_MS = 450;

          /* Keep the chip above neighbors while it shrinks (hover ends
             immediately; layout widths stay put on their own). */
          function holdLookingCollapseZ() {
            looking.classList.add("is-collapsing");
            window.clearTimeout(lookingCollapseTimer);
            lookingCollapseTimer = window.setTimeout(function () {
              looking.classList.remove("is-collapsing");
            }, LOOKING_COLLAPSE_MS);
          }

          function clearLookingCollapseZ() {
            window.clearTimeout(lookingCollapseTimer);
            looking.classList.remove("is-collapsing");
          }

          function setLookingExpanded(expanded) {
            if (expanded) {
              clearLookingCollapseZ();
            } else if (looking.classList.contains("is-expanded")) {
              holdLookingCollapseZ();
            }
            looking.classList.toggle("is-expanded", expanded);
            setLookingAria(expanded);
          }

          function onLookingToggle(e) {
            if (e.target.closest && e.target.closest("a.tile__looking-resume")) return;
            e.preventDefault();
            setLookingExpanded(!looking.classList.contains("is-expanded"));
          }

          if (tapExpand.matches) {
            looking.addEventListener("click", onLookingToggle);
            looking.addEventListener("keydown", function (e) {
              if (e.key !== "Enter" && e.key !== " ") return;
              e.preventDefault();
              setLookingExpanded(!looking.classList.contains("is-expanded"));
            });
            document.addEventListener(
              "pointerdown",
              function (e) {
                if (!looking.classList.contains("is-expanded")) return;
                if (looking.contains(e.target)) return;
                setLookingExpanded(false);
              },
              true
            );
          } else if (fineHover.matches) {
            looking.addEventListener("mouseenter", function () {
              clearLookingCollapseZ();
              setLookingAria(true);
            });
            looking.addEventListener("mouseleave", function () {
              setLookingAria(false);
              holdLookingCollapseZ();
            });
            looking.addEventListener("focusin", function () {
              clearLookingCollapseZ();
              setLookingAria(true);
            });
            looking.addEventListener("focusout", function (e) {
              if (looking.contains(e.relatedTarget)) return;
              setLookingAria(false);
              holdLookingCollapseZ();
            });
          } else {
            looking.addEventListener("click", onLookingToggle);
            looking.addEventListener("keydown", function (e) {
              if (e.key !== "Enter" && e.key !== " ") return;
              e.preventDefault();
              setLookingExpanded(!looking.classList.contains("is-expanded"));
            });
            document.addEventListener(
              "pointerdown",
              function (e) {
                if (!looking.classList.contains("is-expanded")) return;
                if (looking.contains(e.target)) return;
                setLookingExpanded(false);
              },
              true
            );
          }
          body.appendChild(lookingSlot);
          lookingSlot.appendChild(looking);
          statement.appendChild(body);

          tile.appendChild(statement);
          grid.appendChild(tile);

          /* Collapsed chip width must be a px value measured from the lead.
             The frame is always full-open width (clipped), so max-content on
             the chip would resolve to the slot and never hug. */
          function measureLookingChip() {
            if (looking.classList.contains("is-expanded")) return;
            if (looking.matches(":hover") || looking.matches(":focus-within")) return;
            var lead = looking.querySelector(".tile__looking-lead");
            if (!lead) return;
            var cs = window.getComputedStyle(looking);
            var padX =
              (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
            var borderX =
              (parseFloat(cs.borderLeftWidth) || 0) +
              (parseFloat(cs.borderRightWidth) || 0);
            var w = Math.ceil(lead.getBoundingClientRect().width + padX + borderX);
            if (looking.style.getPropertyValue("--looking-chip-w") === w + "px") return;
            looking.classList.add("is-measuring");
            looking.style.setProperty("--looking-chip-w", w + "px");
            void looking.offsetWidth;
            looking.classList.remove("is-measuring");
          }
          measureLookingChip();
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(measureLookingChip);
          }
          window.addEventListener("resize", measureLookingChip);
        }

        appendIntroTile();

        projects.forEach(function (p) {
          var tile = document.createElement("article");
          tile.className = "tile";
          tile.dataset.id = p.id;
          tile.dataset.orient = p.orientation || "landscape";
          tile.dataset.fit = (p.tile && p.tile.fit) || "cover";
          if (p.tile && (p.tile.align || p.tile.coverAlign)) {
            tile.dataset.coverAlign = p.tile.align || p.tile.coverAlign;
          }
          if (p.tile && p.tile.insetShadow) {
            tile.dataset.insetShadow = "true";
          }
          tile.tabIndex = 0;
          tile.setAttribute("role", "button");
          tile.setAttribute("aria-label", p.title + ", " + p.product);

          var surface = document.createElement("div");
          surface.className = "tile__surface";

          var media = document.createElement("div");
          media.className = "tile__media";
          media.setAttribute("aria-hidden", "true");
          var m = p.tile || {};

          if (m.type === "video") {
            var v = document.createElement("video");
            v.src = tileVideoSrc(m.src);
            v.muted = true;
            v.loop = true;
            v.playsInline = true;
            v.setAttribute("playsinline", "");
            v.preload = "metadata";
            v.setAttribute("data-inview", "");
            media.appendChild(v);
          } else if (m.src) {
            var img = document.createElement("img");
            img.src = m.src;
            img.alt = p.title;
            img.loading = "eager";
            media.appendChild(img);
          }

          surface.appendChild(media);
          tile.appendChild(surface);
          tile.appendChild(document.createElement("div")).className = "tile__veil";

          var label = document.createElement("div");
          label.className = "tile__label";
          var prod = document.createElement("p");
          prod.className = "tile__product";
          prod.textContent = p.product;
          var title = document.createElement("h2");
          title.className = "tile__title";
          title.textContent = p.title;
          label.appendChild(prod);
          label.appendChild(title);
          tile.appendChild(label);

          grid.appendChild(tile);
        });

        if (window.initInview) window.initInview(grid);
      })();
    </script>
    <script type="module">
      import { initBentoBulge, getBulgeWhenReady } from "/javascripts/bento-bulge/index.js";
      import { initBentoBulgeOverlays } from "/javascripts/bento-bulge/overlays.js";

      function boot() {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            const bulge = initBentoBulge({
              bento: "#grid",
              projects: "#portfolio",
              cellSelector: ".tile",
              hoverClass: "is-bulge-hovered",
              cornerRadius: 8
            });

            initBentoBulgeOverlays({
              whenBulgeReady: getBulgeWhenReady(),
              onOpen(instant) {
                bulge?.setOverlayOpen?.(true, { instant });
              },
              onClose() {
                bulge?.setOverlayOpen?.(false);
              }
            });
          });
        });
      }

      boot();
